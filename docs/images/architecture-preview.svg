  <rect x="680" y="95" width="100" height="56" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="730" y="130" text-anchor="middle" fill="#ff7b72" font-family="system-ui,sans-serif" font-size="14">Grafana</text>
  <path d="M180 123 L220 123" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
