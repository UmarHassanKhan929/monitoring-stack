global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the Node Exporter for host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # --- EXAMPLE: ADD YOUR BACKEND APP HERE ---
  # - job_name: 'my-python-app'
  #   static_configs:
  #     - targets: ['host.docker.internal:8000'] # Use this for apps running on your host machine